<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 250px; font-family: sans-serif; padding: 10px; margin: 0; }
    h3 { margin-top: 0; color: #333; display: flex; justify-content: space-between; align-items: center; }
    button { 
      width: 100%; padding: 8px; background: #007acc; color: white; 
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #005999; }
    /* Style pour le petit bouton engrenage de configuration */
    .btn-config {
      background: none; border: none; color: #666; font-size: 16px; 
      cursor: pointer; width: auto; padding: 0; display: inline;
    }
    .btn-config:hover { color: #007acc; background: none; }
  </style>
</head>
<body>
  <h3>
    Medic-asset 🩺
    <button id="open-options" class="btn-config" title="Configuration">⚙️</button>
  </h3>
  
  <p>Test de l'ouverture VS Code :</p>
  <button id="open-test">Ouvrir le CSS de test</button>
  <p id="affichage-links" style="word-break: break-all; font-size: 12px; color: #555; margin-top: 10px;"></p>
  
  <script src="popup.js"></script>
</body>
</html>
