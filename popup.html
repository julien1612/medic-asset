<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    h3 {
      margin: 0;
      font-size: 16px;
      color: #2c3e50;
    }
    .btn-gear {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    button.asset-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
    button#open-css {
      background-color: #3498db;
    }
    button#open-css:hover {
      background-color: #2980b9;
    }
    button#open-js {
      background-color: #f1c40f;
      color: #2c3e50;
    }
    button#open-js:hover {
      background-color: #f39c12;
    }
    button:active {
      transform: scale(0.98);
    }
    #affichage-links {
      font-size: 11px;
      color: #7f8c8d;
      text-align: center;
      word-break: break-all;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>Medic-asset 🩺</h3>
    <button id="open-options" class="btn-gear" title="Configuration">⚙️</button>
  </div>

  <div class="btn-container">
    <button id="open-css" class="asset-btn">🎨 Ouvrir CSS</button>
    <button id="open-js" class="asset-btn">⚡ Ouvrir JS</button>
  </div>

  <div id="affichage-links">Prêt à détecter les assets...</div>

  <script src="popup.js"></script>

</body>
</html>
